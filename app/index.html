<!doctype html>
<html><head><meta charset="utf-8"><title>Home</title>
<meta name="viewport" content="width=1920">
<style>
/* Inter (SIL Open Font License 1.1, see THIRD-PARTY.md), Latin subset, for themes with type.font "inter". It is only loaded when a theme uses it. */
@font-face{font-family:"CYTV Inter";src:url(inter-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"CYTV Inter";src:url(inter-500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"CYTV Inter";src:url(inter-600.woff2) format("woff2");font-weight:600 700;font-style:normal;font-display:swap}
/* Built for a weak TV GPU: only transform and opacity ever animate; no blur, masks or filters. Everything a theme changes (manager > Theme) is a
   variable here; the service works the values out (helper/theme.js) and the defaults below are the original look. */
:root{
  --ink:#f5f6f8; --ink2:rgba(245,246,248,.62); --night:#07080b; --night-rgb:7,8,11; --panel:#14161b; --panel2:#1a1c22; --acc:#f5f6f8; --acc-ink:#0b0c10; --focus:#f5f6f8;
  --font:"LG Smart UI","Helvetica Neue",Helvetica,Arial,sans-serif; --fs:1; --spd:1; --glow-op:1; --wall:none; --bd-dim:.25;
  --pill-bg:rgba(255,255,255,.09); --pill-ring:rgba(255,255,255,.10); --pill-r:32px; --pill-h:64px; --bar-gap:16px; --menu-bg:rgba(5,6,9,.97); --row-r:30px;
  --clock-l:96px; --clock-r:auto; --clock-t:54px; --clock-b:auto; --clock-tx:none; --clock-ai:flex-start; --clock-s:1; --date-s:1; --clock-d:flex; --date-d:block;
  --bar-l:auto; --bar-r:96px; --bar-t:54px; --bar-b:auto; --bar-tx:none; --bar-d:flex;
  --name-d:block; --name-x:96px; --name-y:150px; --name-a:left; --name-s:1;
  --view-top:300px; --dock-l:96px; --dock-r:auto; --dock-t:60px; --dock-b:auto; --dock-tx:none; --dock-w:408px; --dock-h:230px; --dock-gap:32px; --dock-rad:36px;
  --dock-panel:0; --dock-pad:0px; --dock-lift:-10px; --dock-fs:1.05;
  --cols:10; --tile-w:151px; --tile-h:151px; --gap-x:24px; --gap-y:26px; --tile-r:34px; --grid-l:96px; --grid-w:1728px; --grid-t:350px; --grid-fs:1.12; --grid-lift:0px; --icon-h:56%; --icon-w:46%; --deck-t:140px; --ov-dim:.95;
  --gloss:0; --tile-border:0; --ring-w:4px; --ring-off:4px;
}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--font)}
body{background-image:var(--wall);background-size:1920px 1080px}
::selection{background:rgba(255,255,255,.25)}

/* backdrop photo (effects.backdrop): two layers cross-fade when the picture changes; darkened so text and tiles stay readable */
.bd{position:absolute;left:0;top:0;width:1920px;height:1080px;background-size:cover;background-position:center;opacity:0;transition:opacity calc(1.2s*var(--spd)) linear}
.bd.on{opacity:1}
[data-backdrop=nature] .bd{will-change:opacity}
#bdim{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;background:var(--night);opacity:var(--bd-dim);transition:opacity calc(.25s*var(--spd)) linear}
[data-backdrop=nature].grid-open #bdim{opacity:.72}   /* the open grid darkens the whole photo, also above the grid's clip line */
#bshade{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;
  background:linear-gradient(180deg,rgba(var(--night-rgb),.5),rgba(var(--night-rgb),0) 22%,rgba(var(--night-rgb),0) 52%,rgba(var(--night-rgb),.55) 78%,rgba(var(--night-rgb),.8))}
[data-backdrop=nature] #bdim,[data-backdrop=nature] #bshade{display:block}
#credit{position:absolute;right:96px;bottom:34px;max-width:1100px;z-index:4;font-size:18px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity calc(.4s*var(--spd)) linear;pointer-events:none}
#credit.on{opacity:.6}
.grid-open #credit.on{opacity:0}
.glow{position:absolute;left:0;top:0;width:1920px;height:720px;opacity:0;transition:opacity calc(.35s*var(--spd)) linear;will-change:opacity;
  background:radial-gradient(ellipse 1400px 640px at 26% -6%,rgba(var(--c),.45),transparent 70%)}
.glow.on{opacity:var(--glow-op)}
/* a wash across the width that fades out over the top 60% of the screen */
[data-glow=top] .glow{height:648px;transition:opacity calc(.35s*var(--spd)) linear,transform calc(.3s*var(--spd)) ease-out;background:linear-gradient(180deg,rgba(var(--c),.4),rgba(var(--c),.28) 22%,rgba(var(--c),.14) 50%,rgba(var(--c),.04) 78%,rgba(var(--c),0))}

#top{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:5;pointer-events:none}
#clock{position:absolute;left:var(--clock-l);right:var(--clock-r);top:var(--clock-t);bottom:var(--clock-b);transform:var(--clock-tx);display:var(--clock-d);align-items:center;height:76px}
#time{font-size:calc(56px*var(--fs)*var(--clock-s));font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
#date{display:var(--date-d);font-size:calc(28px*var(--fs)*var(--date-s));color:rgba(245,246,248,.88);margin-left:22px;padding-top:14px}
[data-clock=stack] #clock{flex-direction:column;align-items:var(--clock-ai);height:auto}
[data-clock=stack] #date{margin:8px 0 0 6px;padding:0}
#bar{pointer-events:auto;position:absolute;left:var(--bar-l);right:var(--bar-r);top:var(--bar-t);bottom:var(--bar-b);transform:var(--bar-tx);display:var(--bar-d);align-items:center;gap:var(--bar-gap);height:calc(var(--pill-h) + 12px)}
.pill{display:flex;align-items:center;gap:14px;height:var(--pill-h);padding:0 30px 0 24px;border-radius:var(--pill-r);font-size:calc(26px*var(--fs));font-weight:500;
  background:var(--pill-bg);box-shadow:inset 0 0 0 1px var(--pill-ring);transition:transform calc(.12s*var(--spd)) cubic-bezier(.3,1.35,.5,1);will-change:transform}
.pill svg{width:30px;height:30px;flex:none}
.pill span{white-space:nowrap}
.pill.f{background:var(--acc);color:var(--acc-ink);transform:scale(1.07)}
[data-bar=round] .pill{width:var(--pill-h);padding:0;justify-content:center}
[data-bar=flat] .pill{background:none;box-shadow:none}
[data-labels=hide] .pill span{display:none}

#shelf{position:absolute;left:0;right:0;top:var(--name-y);height:120px;padding:0 var(--name-x);text-align:var(--name-a);display:var(--name-d);z-index:5}
#name{font-size:calc(92px*var(--fs)*var(--name-s));font-weight:700;letter-spacing:-.028em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the view clips rows as they scroll up under the shelf */
#view{position:absolute;left:0;top:var(--view-top);width:1920px;height:calc(1080px - var(--view-top));overflow:hidden;z-index:2}
#scroll{position:absolute;left:0;top:0;width:1920px;height:calc(1080px - var(--view-top));transition:transform calc(.3s*var(--spd)) ease-out;will-change:transform}
#dock{position:absolute;left:var(--dock-l);right:var(--dock-r);top:var(--dock-t);bottom:var(--dock-b);transform:var(--dock-tx);display:flex;gap:var(--dock-gap);z-index:4;
  padding:var(--dock-pad);border-radius:calc(var(--dock-rad) + var(--dock-pad));background:rgba(255,255,255,var(--dock-panel));box-shadow:inset 0 0 0 1px rgba(255,255,255,calc(var(--dock-panel)*1.4))}
#grid{position:absolute;left:var(--grid-l);top:var(--grid-t);width:var(--grid-w);display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--gap-y) var(--gap-x)}
/* an overlay grid: hidden until the focus moves down into it, then dark layer + grid over the screen above the dock */
[data-grid=overlay] #grid{z-index:3;opacity:0;pointer-events:none;transition:opacity calc(.22s*var(--spd)) linear}
[data-grid=overlay].grid-open #grid{opacity:1;pointer-events:auto}
[data-grid=overlay] #scroll::before,[data-grid=push] #scroll::before{content:'';position:absolute;left:0;top:-1600px;width:1920px;height:4400px;z-index:2;opacity:0;pointer-events:none;background:rgba(var(--night-rgb),var(--ov-dim));transition:opacity calc(.22s*var(--spd)) linear}
[data-grid=overlay].grid-open #scroll::before,[data-grid=push].grid-open #scroll::before{opacity:1}
/* push: the grid sits under the dock; focusing it scrolls the dock up and fades the grid in */
[data-grid=push] #grid{z-index:3;opacity:0;pointer-events:none;transition:opacity calc(.25s*var(--spd)) linear}
[data-grid=push].grid-open #grid{opacity:1;pointer-events:auto}
/* every row of tiles centred, also a last row that is not full */
[data-galign=center] #grid{display:flex;flex-wrap:wrap;justify-content:center}
[data-galign=center] #grid .tile{width:var(--tile-w)}
.tile::after{content:'';position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;opacity:var(--gloss);
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 46%,rgba(0,0,0,.24))}

.tile{--c:74,84,112;--b:20,22,27;position:relative;will-change:transform;
  background:rgb(var(--b));box-shadow:inset 0 0 0 1px rgba(255,255,255,var(--tile-border));transition:transform calc(.12s*var(--spd)) cubic-bezier(.3,1.35,.5,1)}
/* .in holds the picture and clips it to the corners; the tile itself does not clip, so the lift shadow and the label can sit outside it */
.tile .in{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile .cap{display:none}
/* lift: no ring; the tile rises and a shadow drawn once fades in under it (opacity and transform only) */
[data-focus=lift] .tile{transition:transform calc(.22s*var(--spd)) cubic-bezier(.2,.8,.25,1)}
[data-focus=lift] .tile::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;opacity:0;
  box-shadow:0 30px 44px -14px rgba(0,0,0,.75),0 10px 18px -6px rgba(0,0,0,.4);transition:opacity calc(.22s*var(--spd)) linear}
[data-focus=lift] .tile.f::before{opacity:1}
[data-focus=lift] .tile.f{outline:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,var(--tile-border))}
/* the name of the focused app, small, under its tile */
[data-tlabel=focus] .tile .cap{display:block;position:absolute;left:-24px;right:-24px;top:calc(100% + 16px);text-align:center;font-size:calc(24px*var(--fs));font-weight:500;line-height:1.25;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity calc(.18s*var(--spd)) linear}
[data-tlabel=focus] .tile.f .cap{opacity:1}
.snap .tile,.snap .pill,.snap .tile.f::before,.snap .tile .cap{transition:none}   /* held arrow key: follow the focus without animating each step */
.tile.fill img{object-fit:fill}
.tile.press{transform:scale(.96)!important;transition-duration:calc(.06s*var(--spd))}
.tile.launching{opacity:.82}
.tile img{object-fit:contain}
.tile svg{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tile .t{font-size:calc(26px*var(--fs));font-weight:600;padding:12px;text-align:center;line-height:1.15;opacity:.9}
.tile.f{z-index:3;outline:var(--ring-w) solid var(--focus);outline-offset:var(--ring-off);box-shadow:0 24px 36px rgba(0,0,0,.6)}
#dock .tile{width:var(--dock-w);height:var(--dock-h);border-radius:var(--dock-rad)}
#dock .tile img{height:var(--icon-h);max-width:var(--icon-w)}
#dock .tile svg{width:96px;height:96px}
#dock .tile.f{transform:translateY(var(--dock-lift)) scale(var(--dock-fs))}
#grid .tile{height:var(--tile-h);border-radius:var(--tile-r)}
#grid .tile img{width:64%;height:64%}
#grid .tile svg{width:64px;height:64px}
#grid .tile.f{transform:translateY(var(--grid-lift)) scale(var(--grid-fs))}
[data-gicon=center] #grid .tile img{width:auto;height:var(--icon-h);max-width:var(--icon-w)}
#grid .tile.sys .in{flex-direction:column;gap:8px}
.slab{font-size:22px;font-weight:600;color:var(--ink2)}
#grid .tile.sys{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
/* an external input in the dock: the HDMI glyph over the name the TV shows for that input */
#dock .tile.ext .in{flex-direction:column;gap:10px}
#dock .tile.ext .slab{max-width:88%;font-size:20px;line-height:1.2;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-tlabel=focus] .tile.ext .slab{display:none}
/* an input with its own picture (config.json inputIcons): drawn like an app logo on its own colour */
#dock .tile.pic img{width:80%;height:auto;max-width:80%;max-height:var(--icon-h);object-fit:contain}
/* Plex On Deck: a row of cards above the dock (theme ondeck.show), moved away with the dock when the grid opens */
#deck{position:absolute;left:var(--grid-l);top:var(--deck-t);width:var(--grid-w);display:none;z-index:3}
[data-deck=show] #deck.on{display:block}
#deck .dh{font-size:calc(24px*var(--fs));font-weight:600;margin:0 0 18px 4px;opacity:.9;text-shadow:0 1px 10px rgba(0,0,0,.55)}
#deckrow{display:flex}
#deck .tile{flex:none;width:262px;height:148px;margin-right:30px;border-radius:var(--tile-r);background:#15161a}
#deck .tile .in img{width:100%;height:100%;object-fit:cover}
#deck .tile .pb{position:absolute;left:14px;right:14px;bottom:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
#deck .tile .pb i{display:block;height:100%;background:#fff}
#deck .tile.f{transform:translateY(var(--grid-lift)) scale(var(--grid-fs))}
/* hero layout: the first input large (live when the theme asks), the rain forecast and the scenes beside it, apps and On Deck in one row */
#hero,#panel,#dock .dhh,.tile .hx{display:none}
[data-layout=hero] #hero{display:block;position:absolute;left:var(--hero-l);top:var(--hero-t);width:var(--hero-w);height:var(--hero-h);z-index:4}
#hero .tile{width:100%;height:100%;border-radius:22px;background:#000}
#hero .tile.f{transform:scale(1.015);box-shadow:0 0 0 4px var(--ink),0 24px 60px rgba(0,0,0,.6)}
#hero .tile .cap{display:none}
#hero .tile.pic img{width:44%;max-height:40%}
#hero .tile svg{width:140px;height:140px}
#hero .tile .slab{display:none}
#hero video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity calc(.4s*var(--spd)) linear}
#hero .tile.live video{opacity:1}
#hero .tile .hx{display:block;position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;pointer-events:none}
#hero .hl{position:absolute;left:24px;top:24px;padding:6px 14px;border-radius:10px;background:#e5484d;color:#fff;font-size:20px;font-weight:600;opacity:0}
#hero .live .hl{opacity:1}
#hero .hb{position:absolute;left:0;right:0;bottom:0;padding:80px 32px 26px;border-radius:0 0 22px 22px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72));color:#fff}
#hero .hn{font-size:calc(40px*var(--fs));font-weight:600}
[data-layout=hero].grid-open #hero,[data-layout=hero].grid-open #panel{opacity:0;pointer-events:none}
#hero,#panel{transition:opacity calc(.25s*var(--spd)) linear}
[data-layout=hero] #panel{display:block;position:absolute;left:var(--panel-l);top:var(--hero-t);width:var(--panel-w);height:var(--hero-h);z-index:4}
.pn{background:rgba(22,27,35,.86);border-radius:22px;padding:24px 28px;box-sizing:border-box;height:calc(50% - 12px);overflow:hidden}
#wx{margin-bottom:24px}
[data-weather=hide] #wx,[data-lights=hide] #lt{display:none}
[data-weather=hide] #lt,[data-lights=hide] #wx{height:100%;margin:0}
.pn .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.pn .ph b{font-size:calc(28px*var(--fs));font-weight:600}
.pn .ph span{font-size:calc(20px*var(--fs));color:var(--ink2)}
.pn .pm{font-size:calc(22px*var(--fs));color:var(--ink2);line-height:1.35}
#wx .hrs{display:flex}
#wx .hr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:160px;margin-right:10px;padding:12px 0;box-sizing:border-box;border-radius:14px;background:rgba(255,255,255,.05);font-size:calc(19px*var(--fs))}
#wx .hr:last-child{margin-right:0}
#wx .hr span{color:var(--ink2)}
#wx .hr b{font-size:calc(24px*var(--fs));font-weight:600}
#wx .hr i{font-style:normal;font-size:calc(18px*var(--fs));color:#a9d2ff}
#wx svg{width:40px;height:40px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#wx svg.rain,#wx svg.snow{stroke:#8cc4ff}#wx svg.clear{stroke:#ffd36b}#wx svg.night{stroke:#d9dcff}#wx svg.cloud{stroke:#c9d3df}
#ltclip{overflow:hidden;margin:-8px -8px 0;padding:8px}
#ltrow{display:flex;transition:transform calc(.25s*var(--spd)) ease-out}   /* one row of large buttons; it slides along with the focus */
.tile.lt{flex:none;width:176px;height:168px;margin:0 16px 0 0;border-radius:16px;background:rgba(255,255,255,.07)}
.tile.lt .in{flex-direction:column;align-items:flex-start;justify-content:space-between;padding:18px 18px 16px;box-sizing:border-box}
.tile.lt svg{width:40px;height:40px}
.tile.lt .ln{font-size:calc(24px*var(--fs));font-weight:500;line-height:1.15;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile.lt.on{background:#ffc861;color:#2a1c00}
.tile.lt.on svg{stroke:#2a1c00}
.tile.lt.na{opacity:.5}
.tile.lt.f{transform:scale(1.06)}
[data-layout=hero] #deck{display:none!important}
[data-layout=hero] #dock{transition:transform calc(.25s*var(--spd)) ease-out}
[data-layout=hero] #dock .tile.card{width:calc(var(--dock-h)*16/9);margin-left:0;background:#15161a}
[data-layout=hero] #dock .tile.card .in img{width:100%;height:100%;max-width:none;object-fit:cover}
[data-layout=hero] #dock .tile.card .pb{position:absolute;left:14px;right:14px;bottom:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
[data-layout=hero] #dock .tile.card .pb i{display:block;height:100%;background:#fff}
[data-layout=hero] #dock .tile.first{margin-left:32px}
.zooming #view{overflow:visible}   /* the scroll area's clip line would cut the growing tile */
.tile.zoom{z-index:60;transition:transform calc(.34s*var(--spd)) cubic-bezier(.4,0,.2,1)!important}
.tile.zoom .cap,.tile.zoom::before,.tile.zoom .hx,.tile.zoom .pb{opacity:0!important;transition:opacity calc(.15s*var(--spd)) linear}
.tile.zoom .in>*{transition:transform calc(.34s*var(--spd)) cubic-bezier(.4,0,.2,1),opacity calc(.2s*var(--spd)) linear}
.zooming #top,.zooming #panel,.zooming #credit,.zooming #shelf,.zooming #deck .dh,.zooming #dock .dhh,.zooming .tile:not(.zoom){opacity:0!important;transition:opacity calc(.2s*var(--spd)) linear!important}
[data-layout=hero] #dock .dhh{display:block;position:absolute;top:-56px;font-size:calc(28px*var(--fs));font-weight:600;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.55)}   /* the label under the tile already names the input */

/* Inter is set lighter than the TV's own face */
[data-font=inter] #time{font-weight:500;letter-spacing:-.01em}
[data-font=inter] #name,[data-font=inter] #ov h2{font-weight:600;letter-spacing:-.02em}
[data-font=inter] .tile .t,[data-font=inter] .slab{font-weight:500}

#toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:40;padding:18px 38px;border-radius:34px;font-size:28px;
  background:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);opacity:0;pointer-events:none}
#toast.on{opacity:1}

/* menus */
#ov{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:30;background:var(--menu-bg);display:flex;align-items:center;justify-content:center}
#ov .panel{width:760px;display:flex;flex-direction:column;gap:12px}
#ov h2{font-size:46px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:22px;height:84px;padding:0 34px;border-radius:var(--row-r);font-size:calc(30px*var(--fs));font-weight:500;
  background:var(--panel2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.row svg{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-size:22px;opacity:.65}
.row.dim{opacity:.6}
.row.f{background:var(--acc);color:var(--acc-ink);opacity:1}
.more{height:22px;text-align:center;font-size:20px;color:var(--ink2)}

/* Live TV (inside the launcher) */
#lv{--ink2:rgba(245,246,248,.76);position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:60;background:#000;display:none}
#lv.on{display:block}
#lv-stage,#lv-stage video{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#000}
#lv .layer{position:absolute;opacity:0;pointer-events:none;transition:opacity .2s linear}
#lv .layer.on{opacity:1}
/* channel banner: a floating panel in the launcher's style */

    if(g===0)return chans;
    if(g===1)return S.fav.map(function(k){return byKey[k]}).filter(Boolean);
    if(g===2)return S.recent.map(function(k){return byKey[k]}).filter(Boolean);
    var n=groups[g-3];return chans.filter(function(c){return c.cats.indexOf(n)>=0})}
  function listFor(g){return baseList(g).filter(passes)}
  function tabNames(){return [t('All channels'),t('Favourites'),t('Recent')].concat(groups)}
  function gcolor(){var n=tabNames()[L.g],c=hsl2rgb(hashHue(n),.5,.42);$('lv-glow').style.setProperty('--c',c.join(','))}
  function openList(){
    L.open=true;var c=byNum[cur];L.g=0;
    if(c&&c.cats[0]){var gi=groups.indexOf(c.cats[0]);if(gi>=0)L.g=gi+3}
    L.list=listFor(L.g);L.ci=Math.max(0,L.list.indexOf(c));drawList();$('lv').classList.add('gd');layer('lv-guide',true);fetchVisible()}
  function closeList(){L.open=false;endSearch(false);FP.open=false;layer('lv-filter',false);$('lv').classList.remove('gd');layer('lv-guide',false)}
  function pct(p,now){return Math.max(0,Math.min(100,(now-p[0])/(p[1]-p[0])*100))}
  var STAR='<svg class="st" viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z"/></svg>';
  function badges(c){
    var h='';if(isFav(c))h+=STAR;
    if(c.q)h+='<span class="bd">'+c.q+'</span>';
    if(c.fl&1)h+='<span class="bd w">GEO</span>';if(c.fl&2)h+='<span class="bd w">NOT 24/7</span>';if(c.fl&4)h+='<span class="bd w">HEADERS</span>';
    if(c.alt.length)h+='<span class="bd">×'+(c.alt.length+1)+'</span>';
    if(c.key&&S.failed[c.key])h+='<span class="bd w">!</span>';
    return h?'<div class="bds">'+h+'</div>':''}
  function filterText(){var a=[];if(F.cc)a.push(cname(F.cc));if(F.lang)a.push(F.lang);if(F.q)a.push(F.q);if(Q)a.push('“'+Q+'”');return a.join('  ·  ')}
  function drawList(){
    var now=Math.floor(Date.now()/1000),names=tabNames();
    $('lv-gtitle').textContent=t('Live TV');
    var d=new Date(),tabs='';
    if(L.g>0)tabs+='<div class="ctab m">‹</div><div class="ctab">'+lesc(names[L.g-1])+'</div>';
    tabs+='<div class="ctab on">'+lesc(names[L.g])+'</div>';
    if(L.g<names.length-1)tabs+='<div class="ctab">'+lesc(names[L.g+1])+'</div><div class="ctab m">›</div>';
    var ft=filterText();if(ft)tabs+='<div class="ctab f">'+lesc(t('Filters')+': '+ft)+'</div>';
    setHtml($('lv-gtabs'),tabs);
    $('lv-gclock').textContent=d.toLocaleTimeString(LOC,clockOpts());gcolor();
    var N=7,cs=Math.max(0,Math.min(L.ci-3,L.list.length-N)),h='';
    for(var j=cs;j<Math.min(L.list.length,cs+N);j++){
      var c=L.list[j],e=epgNow[c.id],pn=e&&e.now;
      h+='<div class="crow'+(j===L.ci?' f':'')+(c.num===cur?' cur':'')+'"><div class="n">'+c.num+'</div>'+(c.logo?'<img class="lg" src="'+lesc(c.logo)+'" alt="">':'<div class="lg"></div>')
        +'<div class="t"><div class="nm">'+lesc(c.name)+'</div><div class="nw">'+(pn?lesc(hm(pn[0])+'  '+pn[2]):(e?'':lesc(t('No guide data'))))+'</div>'
        +(pn?'<div class="pbar"><i style="width:'+pct(pn,now)+'%"></i></div>':'')+'</div>'+badges(c)+'</div>'}
    if(!L.list.length)h='<div class="empty">'+lesc(t(L.g===1&&!S.fav.length?'No favourites yet. Press the green button on a channel.':L.g===2&&!S.recent.length?'Nothing watched yet.':'No channels match.'))+'</div>';
    setHtml($('lv-rows'),h);drawDetail()}
  function drawDetail(){
    var c=L.list[L.ci];if(!c){setHtml($('lv-detail'),'');return}
    var f=full[c.id],now=Math.floor(Date.now()/1000),h='<div class="dn">'+lesc(c.name)+'</div><div class="dg">'+lesc(c.cats.join(', '))+'</div><div class="dg">'+lesc(facts(c))+'</div>';
    if(f&&f.list&&f.list.length){
      var p=f.list[0],live=p[0]<=now;
      h+='<div class="card"><div class="dt">'+lesc(hm(p[0])+' – '+hm(p[1]))+'</div><div class="dp">'+lesc(p[2])+'</div>'+(p[3]?'<div class="dd">'+lesc(p[3])+'</div>':'')+(live?'<div class="pbar"><i style="width:'+pct(p,now)+'%"></i></div>':'')+'</div>';
      if(f.list.length>1){h+='<h3>'+t('Later')+'</h3>';for(var i=1;i<Math.min(5,f.list.length);i++)h+='<div class="up"><div class="tm">'+hm(f.list[i][0])+'</div><div class="tt">'+lesc(f.list[i][2])+'</div></div>'}}
    else h+='<div class="card"><div class="dt">'+lesc(f?t('No guide data'):'…')+'</div></div>';
    setHtml($('lv-detail'),h)}
  function fetchVisible(){
    clearTimeout(fetchT);fetchT=setTimeout(function(){
      var cs=Math.max(0,Math.min(L.ci-3,L.list.length-7)),ids=L.list.slice(cs,cs+7).map(function(c){return c.id}).filter(function(i){return i&&!epgNow[i]});
      if(ids.length)loadEpg(ids,function(){if(L.open)drawList()});
      var c=L.list[L.ci];if(c&&c.id&&!full[c.id])api('/api/live/epg?full=1&ids='+encodeURIComponent(c.id)).then(function(x){full[c.id]=x[c.id]||{list:[]};if(L.open)drawDetail()}).catch(function(){})},160)}
  function relist(){L.list=listFor(L.g);L.ci=0;drawList();fetchVisible()}

  /* search: the TV's own keyboard types into an input; the list follows what is typed */
  function startSearch(){searching=true;if(L.g>2){L.g=0;L.list=listFor(0);L.ci=0;drawList()}   /* a search looks through all channels, not one category */
    var i=$('lv-search');i.value=Q;i.placeholder=t('Search...');i.style.display='block';i.focus()}
  function endSearch(keep){
    if(!searching)return;searching=false;var i=$('lv-search');if(!keep){Q='';i.value=''}
    i.style.display='none';i.blur();if(L.open)relist()}
  $('lv-search').addEventListener('input',function(){Q=this.value.trim().toLowerCase();if(L.open)relist()});

  /* filters */
  function fvals(k){return [''].concat(fac[k])}
  function filterRows(){
    return [{k:'cc',label:t('Country'),val:F.cc?cname(F.cc):t('All')},{k:'lang',label:t('Language'),val:F.lang||t('All')},{k:'q',label:t('Quality'),val:F.q||t('All')},{k:'clear',label:t('Clear filters'),val:''}]}
  function drawFilter(){
    var r=filterRows(),h='<h3>'+lesc(t('Filters'))+'</h3>';
    for(var i=0;i<r.length;i++)h+='<div class="mrow'+(i===FP.i?' f':'')+'"><div class="ml">'+lesc(r[i].label)+'</div><div class="mv">'+(r[i].k==='clear'?'':'‹ ')+lesc(r[i].val)+(r[i].k==='clear'?'':' ›')+'</div></div>';
    setHtml($('lv-filter'),h)}
  function stepFilter(k,d){
    var v=fvals(k),i=v.indexOf(F[k]);i=(i+d+v.length)%v.length;F[k]=v[i];relist();drawFilter()}
  function filterKey(k){
    if(k===38){if(FP.i>0)FP.i--}else if(k===40){if(FP.i<3)FP.i++}
    else if(k===37||k===39){var r=filterRows()[FP.i];if(r.k!=='clear')stepFilter(r.k,k===37?-1:1);return}
    else if(k===13){var r2=filterRows()[FP.i];if(r2.k==='clear'){F={cc:'',lang:'',q:''};relist()}else FP.open=false}
    else if(k===405||k===461||k===27||k===8){FP.open=false}
    if(!FP.open){layer('lv-filter',false);drawList();return}
    drawFilter()}

  /* the player menu (Yellow while watching) */
  function menuItems(){
    var c=byNum[cur],it=[{label:t('Favourite'),sub:t(isFav(c)?'On':'Off'),fn:function(){toggleFav(c);drawMenu()}}];
    if(streams.length>1)streams.forEach(function(s,i){it.push({label:t('Stream')+' '+(i+1)+(s.q?'  '+s.q:''),sub:i===si?'✓':'',fn:function(){M.open=false;layer('lv-menu',false);pickStream(i)}})});
    it.push({label:t('Statistics'),sub:t(stats?'On':'Off'),fn:function(){setStats(!stats);drawMenu()}});
    it.push({label:t('Close'),sub:'',fn:function(){M.open=false;layer('lv-menu',false)}});
    return it}
  function drawMenu(){
    M.items=menuItems();if(M.i>=M.items.length)M.i=M.items.length-1;
    var h='<h3>'+lesc(byNum[cur].name)+'</h3>';
    for(var i=0;i<M.items.length;i++)h+='<div class="mrow'+(i===M.i?' f':'')+'"><div class="ml">'+lesc(M.items[i].label)+'</div><div class="mv">'+lesc(M.items[i].sub)+'</div></div>';
    setHtml($('lv-menu'),h)}
  function openMenu(){M.open=true;M.i=0;drawMenu();layer('lv-menu',true)}
  function menuKey(k){
    if(k===38){if(M.i>0)M.i--}else if(k===40){if(M.i<M.items.length-1)M.i++}
    else if(k===13){M.items[M.i].fn();return}
    else if(k===405||k===461||k===27||k===8){M.open=false;layer('lv-menu',false);return}
    drawMenu()}

  /* statistics (Blue while watching): what the TV tells a web page about the picture */
  function statsText(){
    var v=video;if(!v)return '';
    var q=v.getVideoPlaybackQuality?v.getVideoPlaybackQuality():null,ahead=0;
    try{if(v.buffered&&v.buffered.length)ahead=v.buffered.end(v.buffered.length-1)-v.currentTime}catch(e){}
    return (v.videoWidth?v.videoWidth+'×'+v.videoHeight:'no picture')+'\n'+t('buffer')+' '+ahead.toFixed(1)+' s\n'+(q?t('frames')+' '+q.totalVideoFrames+', '+t('dropped')+' '+q.droppedVideoFrames+'\n':'')+t('Stream')+' '+(si+1)+'/'+streams.length+(reloads?'  ('+t('reloaded')+')':'')}
  function setStats(on){stats=on;clearInterval(statsT);layer('lv-stats',on);if(on){$('lv-stats').textContent=statsText();statsT=setInterval(function(){$('lv-stats').textContent=statsText()},1000)}}

  function digit(d){
    numBuf+=d;if(numBuf.length>5)numBuf=numBuf.slice(-5);
    $('lv-numin').textContent=numBuf;layer('lv-numin',true);clearTimeout(numT);
    numT=setTimeout(function(){var n=parseInt(numBuf,10);numBuf='';layer('lv-numin',false);if(byNum[n])play(n);else showOsd()},1800)}
  function setup(){
    api('/api/live/pair',{}).then(function(p){
      msg('<b>'+t('Set up Live TV')+'</b><div>'+t('Open this address on your phone or computer:')+'</div><b>'+lesc(p.url)+'</b><div>'+t('and enter this code:')+'</div><b>'+lesc(p.code)+'</b><div class="small">'+t('Then paste your M3U playlist address. This page closes by itself.')+'</div>');
      clearInterval(setupT);setupT=setInterval(function(){if(!o.on){clearInterval(setupT);return}api('/api/live/status').then(function(s){if(s.configured){clearInterval(setupT);boot()}})},2500)})}
  function facets(){
    function top(k){var n={};chans.forEach(function(c){if(c[k])n[c[k]]=(n[c[k]]||0)+1});return Object.keys(n).sort(function(a,b){return n[b]-n[a]||(a<b?-1:1)}).slice(0,40)}
    fac={cc:top('cc'),lang:top('lang'),q:['SD','HD','FHD','4K'].filter(function(q){return chans.some(function(c){return c.q===q})})}}
  function boot(){
    msg('<div>'+t('Loading channels...')+'</div>');
    api('/api/live/status').then(function(s){
      if(!s.configured){setup();return}
      var tries=0;
      (function load(){
        if(!o.on)return;
        api('/api/live/channels').then(function(x){
          if(!x.channels.length){if(++tries>40){msg('<div>'+lesc(s.error||'No channels')+'</div>');return}setTimeout(load,2000);return}
          groups=x.groups;chans=x.channels.map(function(r){return {num:r[0],id:r[1],name:r[2],group:r[3],logo:r[4],url:r[5],key:r[6]||'',cc:r[7]||'',lang:r[8]||'',q:r[9]||'',fl:r[10]||0,cats:r[11]||(r[3]?[r[3]]:[]),alt:(r[12]||[]).map(function(a){return {url:a[0],q:a[1]}})}});
          byNum={};byKey={};chans.forEach(function(c){byNum[c.num]=c;if(c.key)byKey[c.key]=c});loaded=true;facets();
          var last=0;try{last=parseInt(localStorage.getItem('live.last'),10)}catch(e){}
          api('/api/live/state').then(function(st){S={fav:st.fav||[],recent:st.recent||[],failed:st.failed||{}}},function(){}).then(function(){
            layer('lv-msg',false);play(byNum[last]?last:chans[0].num);if(guideNext){guideNext=false;openList()}})})
      })()
    }).catch(function(){msg('<div>'+t('The helper is not reachable.')+'</div>');setTimeout(function(){if(o.on)boot()},3000)})}
  function step(d){var i=chans.indexOf(byNum[cur]);i=(i+d+chans.length)%chans.length;play(chans[i].num,false,180)}
  var guideNext=false;
  o.enter=function(guide){o.on=true;guideNext=!!guide;$('lv').classList.add('on');if(loaded&&byNum[cur]){play(cur);if(guideNext){guideNext=false;openList()}}else boot()};
  o.toggleGuide=function(){if(!loaded)return;if(L.open)closeList();else{M.open=false;layer('lv-menu',false);openList()}};
  o.exit=function(){o.on=false;closeList();M.open=false;layer('lv-menu',false);setStats(false);full={};release();clearTimeout(osdT);clearTimeout(numT);clearTimeout(toastT);clearInterval(setupT);layer('lv-osd',false);layer('lv-numin',false);layer('lv-msg',false);layer('lv-spin',false);layer('lv-tune',false);layer('lv-toast',false);$('lv').classList.remove('on')};
  o.key=function(e){
    var k=e.keyCode;
    if(searching){   /* the input has the keys; only Enter and Back are ours */
      if(k===13){e.preventDefault();endSearch(true)}
      else if(k===461||k===27){e.preventDefault();if(Q)endSearch(false);else endSearch(true)}
      return}
    e.preventDefault();
    if(!loaded){if(k===461||k===27||k===8)o.exit();return}
    if(FP.open){filterKey(k);return}
    if(M.open){menuKey(k);return}
    if(L.open){
      var n7=7;
      if(k===38){if(L.ci>0)L.ci--}
      else if(k===40){if(L.ci<L.list.length-1)L.ci++}
      else if(k===33||k===427){L.ci=Math.max(0,L.ci-n7)}
      else if(k===34||k===428){L.ci=Math.min(L.list.length-1,L.ci+n7)}
      else if(k===37){if(L.g>0){L.g--;L.list=listFor(L.g);L.ci=0}}
      else if(k===39){if(L.g<groups.length+2){L.g++;L.list=listFor(L.g);L.ci=0}}
      else if(k===13){if(L.list[L.ci]){var n=L.list[L.ci].num;closeList();play(n);return}}
      else if(k===458){closeList();return}
      else if(k===404){toggleFav(L.list[L.ci]);return}
      else if(k===405){FP.open=true;FP.i=0;drawFilter();layer('lv-filter',true);return}
      else if(k===403){startSearch();return}
      else if(k===461||k===27||k===8){if(Q||F.cc||F.lang||F.q){Q='';F={cc:'',lang:'',q:''};relist();return}closeList();return}
      else if(k>=48&&k<=57){closeList();digit(k-48);return}
      else return;
      drawList();fetchVisible();return}
    if(k===13){if(failed)play(cur);else openList()}
    else if(k===404)toggleFav(byNum[cur]);
    else if(k===405)openMenu();
    else if(k===406)setStats(!stats);
    else if(k===38||k===33||k===427)step(1);
    else if(k===40||k===34||k===428)step(-1);
    else if(k===458)openList();
    else if(k===457||k===37||k===39)showOsd();
    else if(k>=48&&k<=57)digit(k-48);
    else if(k>=96&&k<=105)digit(k-96);
    else if(k===461||k===27||k===8)o.exit()};
  return o})();

/* first paint straight from the last known layout, then refresh from the helper */
try{var cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
  if(cached&&cached.apps&&cached.apps.length){apps=cached.apps;cfg=cached.cfg||{};applyTheme(cfg.theme);usage=cached.usage||{};colors=cached.colors||{};rebuild()}}catch(e){}
load();wantInputs();
api('/api/frontend-ok',{version:VERSION}).catch(function(){});   // lets the manager know an updated launcher started
</script></body></html>
